# Sobe MySQL 8 (com schema + seed aplicados na inicialização) e a API.
#   docker compose up --build
# API:   http://localhost:3001/api/health
# MySQL: localhost:3306  (lar_cia / lar_cia)

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lar_cia
      MYSQL_USER: lar_cia
      MYSQL_PASSWORD: lar_cia
    ports:
      - "3306:3306"
    volumes:
      - lar_cia_db:/var/lib/mysql
      # Scripts em /docker-entrypoint-initdb.d rodam em ordem alfabética na 1ª subida
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: lar_cia
      DB_PASSWORD: lar_cia
      DB_NAME: lar_cia
      PORT: "3001"
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lar_cia_db:
