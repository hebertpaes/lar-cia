# Configuração Nginx para servir o Flutter Web (consumida pelos Dockerfiles).
# Cloud Run injeta $PORT; aqui escutamos 8080 (padrão do contêiner).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm font/woff2;

  # Headers de segurança (boas práticas)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  # SPA: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets versionados: cache longo e imutável
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML e service worker: nunca cachear
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
  }

  # Healthcheck simples
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
