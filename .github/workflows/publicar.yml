name: Publicar notícias (automático)

# Coleta as notícias do dia das assessorias oficiais (RSS) e publica nos 3
# portais, roteando por editoria. Roda NA NUVEM (não precisa do seu Mac).
#
# Antes de usar, cadastre os segredos em:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     HOJEMT_ADMIN_KEY        = id:secret   (Admin API Key do Hoje MT)
#     ODIAPOLITICO_ADMIN_KEY  = id:secret   (Admin API Key do O Dia Político)
#     PACUNEWS_ADMIN_KEY      = id:secret   (Admin API Key do Pacu News)
#
# Dispare manualmente em Actions → "Publicar notícias" → Run workflow, ou deixe
# no agendamento diário abaixo.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não publica)"
        type: boolean
        default: true
  schedule:
    - cron: "0 11 * * *"   # 08:00 no horário de Cuiabá (UTC-3) — ajuste se quiser

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Coletar + publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar config dos sites
        run: cp ghost/automation/sites.config.example.json ghost/automation/sites.config.json

      - name: Instalar navegador headless (Playwright) p/ a SECOM
        run: npm i playwright --no-save && npx playwright install --with-deps chromium

      - name: Coletar SECOM-MT (headless — a lista é montada por JavaScript)
        run: node ghost/automation/secom-headless.mjs --out=ghost/import/secom-hoje.json --verbose || echo "SECOM sem itens hoje."

      - name: Coletar notícias do dia (RSS das assessorias)
        # teto de 4 min: muitas prefeituras não têm RSS e não podem travar o job
        run: timeout 240 node ghost/automation/collect.mjs --out=ghost/import/coletado-hoje.json --conc=12 || echo "Coleta RSS encerrada (tempo/sem itens)."

      - name: Publicar nos portais (roteando por editoria)
        env:
          HOJEMT_ADMIN_KEY: ${{ secrets.HOJEMT_ADMIN_KEY }}
          ODIAPOLITICO_ADMIN_KEY: ${{ secrets.ODIAPOLITICO_ADMIN_KEY }}
          PACUNEWS_ADMIN_KEY: ${{ secrets.PACUNEWS_ADMIN_KEY }}
        run: |
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          for FILE in ghost/import/coletado-hoje.json ghost/import/secom-hoje.json; do
            [ -f "$FILE" ] || { echo "sem $FILE — pulando"; continue; }
            echo "== publicando $FILE $DRY =="
            node ghost/automation/publish.mjs "$FILE" $DRY
          done

      - name: Guardar o que foi coletado (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coletado
          path: |
            ghost/import/coletado-hoje.json
            ghost/import/secom-hoje.json
          if-no-files-found: ignore
