name: Publicar notícias (automático)

# Coleta as notícias do dia das assessorias oficiais (RSS) e publica nos 3
# portais, roteando por editoria. Roda NA NUVEM (não precisa do seu Mac).
#
# Antes de usar, cadastre os segredos em:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     HOJEMT_ADMIN_KEY        = id:secret   (Admin API Key do Hoje MT)
#     ODIAPOLITICO_ADMIN_KEY  = id:secret   (Admin API Key do O Dia Político)
#     PACUNEWS_ADMIN_KEY      = id:secret   (Admin API Key do Pacu News)
#
# Dispare manualmente em Actions → "Publicar notícias" → Run workflow, ou deixe
# no agendamento diário abaixo.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não publica)"
        type: boolean
        default: true
  schedule:
    # De hora em hora, todos os dias. Cada run publica só o que for NOTÍCIA NOVA
    # real (o dedup por slug ignora repetidas), então o volume acompanha a
    # notícia — não força número. Para gastar menos minutos de Actions, dá para
    # limitar às horas ativas, ex.: cron "0 9-23 * * *".
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Coletar + publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar config dos sites
        run: cp ghost/automation/sites.config.example.json ghost/automation/sites.config.json

      # Obs.: a SECOM/estado de MT bloqueiam o IP da nuvem, então a coleta da
      # SECOM roda LOCAL (ghost/scripts/publicar-secom.sh). Aqui pegamos as fontes
      # com RSS que a nuvem alcança (federais: Agência Brasil/Câmara/Senado etc.).
      - name: "Coletar notícias do dia (RSS: assessorias MT + fontes federais)"
        run: timeout 240 node ghost/automation/collect.mjs --out=ghost/import/coletado-hoje.json --conc=12 --verbose || echo "Coleta RSS encerrada (tempo/sem itens)."

      # REDATOR automático POR PORTAL: cada portal reescreve a MESMA notícia com a
      # sua VOZ (--persona) e recebe o texto único — assim Hoje MT, Pacu News e O
      # Dia Político não ficam clones (evita conteúdo duplicado, ruim de SEO). Só o
      # COLETADO (bruto, de fontes oficiais/CC) passa pela IA; a reserva gerada já
      # vem pronta e é publicada como está. --max limita custo por portal. Sem
      # IA_API_KEY, a reescrita é pulada (copia o original) e os portais ficam iguais.
      - name: Reescrever com a voz de cada portal e publicar (roteando por editoria)
        env:
          IA_API_KEY: ${{ secrets.IA_API_KEY }}
          IA_API_URL: ${{ vars.IA_API_URL }}
          IA_MODEL: ${{ vars.IA_MODEL }}
          HOJEMT_ADMIN_KEY: ${{ secrets.HOJEMT_ADMIN_KEY }}
          ODIAPOLITICO_ADMIN_KEY: ${{ secrets.ODIAPOLITICO_ADMIN_KEY }}
          PACUNEWS_ADMIN_KEY: ${{ secrets.PACUNEWS_ADMIN_KEY }}
          # Opcional: webhook de disparo no WhatsApp (LeTalk, WaSpeed, Zapier…).
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          RESERVA="ghost/import/gerado-$(date -u +%F).json"
          for P in hojemt pacunews odiapolitico; do
            echo "==================  PORTAL: $P  =================="
            if [ -f ghost/import/coletado-hoje.json ]; then
              # Reescreve com a voz do portal; se a IA falhar, cai no original.
              node ghost/automation/reescrever.mjs ghost/import/coletado-hoje.json \
                --persona=$P --max=10 --verbose --out=ghost/import/coletado-$P.json \
                || cp ghost/import/coletado-hoje.json ghost/import/coletado-$P.json
              echo "-- publicando coletado ($P) $DRY --"
              node ghost/automation/publish.mjs ghost/import/coletado-$P.json --only=$P $DRY
            fi
            # Reserva do dia (já pronta) — publicada como está, roteando por editoria.
            if [ -f "$RESERVA" ]; then
              echo "-- publicando reserva ($P) $DRY --"
              node ghost/automation/publish.mjs "$RESERVA" --only=$P $DRY
            fi
          done

      - name: Guardar o que foi coletado (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coletado
          path: |
            ghost/import/coletado-hoje.json
            ghost/import/secom-hoje.json
          if-no-files-found: ignore
