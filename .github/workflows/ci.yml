name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghost:
    name: Tema Ghost + conteúdo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sintaxe JS
        run: node --check ghost/import/generate-ghost-import.mjs && node --check ghost/theme/lar-cia/assets/js/main.js

      - name: Validar JSON (seed + import)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('seed/seed.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('ghost/import/ghost-import.json','utf8'))"

      - name: Import em dia com o seed (sem drift)
        run: |
          node ghost/import/generate-ghost-import.mjs
          git diff --exit-code ghost/import/ghost-import.json

      - name: Validar tema com gscan
        run: |
          npm install gscan --no-save --no-audit --no-fund
          node -e '
            const gscan = require("gscan");
            gscan.check("ghost/theme/lar-cia").then((theme) => {
              const r = gscan.format(theme, { onlyFatalErrors: false });
              const errors = (r.results.error || []).length;
              const warnings = (r.results.warning || []).length;
              console.log("gscan -> erros:", errors, "| avisos:", warnings);
              (r.results.error || []).forEach((e) => console.log("  ✗", (e.fatal ? "[fatal] " : "") + (e.rule || e.code)));
              if (errors > 0) process.exit(1);
            }).catch((e) => { console.error(e); process.exit(1); });
          '
