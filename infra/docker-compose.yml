# Stack dos 3 portais Ghost na VM (Azure) — sobe com um comando.
#   Ghost 6 (×3) + MySQL 8 + Caddy (HTTPS automático via Let's Encrypt).
# A Caddy também serve o site de comandos em openclaw.ai.
#
# Uso:  cp .env.example .env  (edite as senhas)  &&  bash setup.sh
services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ghost-hojemt:
    image: ghost:6-alpine
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      url: https://hojemt.com.br
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost_hojemt
      mail__transport: SMTP
      mail__options__service: ${MAIL_SERVICE}
      mail__options__auth__user: ${MAIL_USER}
      mail__options__auth__pass: ${MAIL_PASS}
    volumes:
      - hojemt-content:/var/lib/ghost/content

  ghost-odiapolitico:
    image: ghost:6-alpine
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      url: https://odiapolitico.com.br
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost_odiapolitico
      mail__transport: SMTP
      mail__options__service: ${MAIL_SERVICE}
      mail__options__auth__user: ${MAIL_USER}
      mail__options__auth__pass: ${MAIL_PASS}
    volumes:
      - odiapolitico-content:/var/lib/ghost/content

  ghost-pacunews:
    image: ghost:6-alpine
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      url: https://pacunews.com.br
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost_pacunews
      mail__transport: SMTP
      mail__options__service: ${MAIL_SERVICE}
      mail__options__auth__user: ${MAIL_USER}
      mail__options__auth__pass: ${MAIL_PASS}
    volumes:
      - pacunews-content:/var/lib/ghost/content

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/openclaw:ro
      - ./comenta:/srv/comenta:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ghost-hojemt
      - ghost-odiapolitico
      - ghost-pacunews

volumes:
  db-data:
  hojemt-content:
  odiapolitico-content:
  pacunews-content:
  caddy-data:
  caddy-config:
