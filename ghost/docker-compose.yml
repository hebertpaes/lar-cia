# Sobe o Ghost + MySQL 8 com o tema LAR & CIA montado.
#   cd ghost && docker compose up
# Depois: http://localhost:2368/ghost  → crie o admin, ative o tema "lar-cia",
# importe import/ghost-import.json e suba o routes.yaml (Settings → Labs).

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ghost
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    volumes:
      - ghost_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pghost"]
      interval: 5s
      timeout: 5s
      retries: 20

  ghost:
    image: ghost:5-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      url: http://localhost:2368
      database__client: mysql
      database__connection__host: db
      database__connection__port: "3306"
      database__connection__user: ghost
      database__connection__password: ghost
      database__connection__database: ghost
    ports:
      - "2368:2368"
    volumes:
      - ghost_content:/var/lib/ghost/content
      # Tema montado (ative em Settings → Design)
      - ./theme/lar-cia:/var/lib/ghost/content/themes/lar-cia
      # Roteamento dinâmico (/imovel, /blog, /categoria)
      - ./routes.yaml:/var/lib/ghost/content/settings/routes.yaml

volumes:
  ghost_db:
  ghost_content:
