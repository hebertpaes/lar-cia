# Roteamento do portal de notícias LAR & CIA.
# A home usa o template home.hbs (montado por editorias).
# As notícias ficam na raiz (/slug/) e a coleção em /noticias/.
# Os "posts de anúncio" (#ad) ficam fora das coleções e listagens.

routes:
  /: home

collections:
  /noticias/:
    permalink: /{slug}/
    template: index
    filter: tag:-hash-ad

taxonomies:
  tag: /editoria/{slug}/
  author: /autor/{slug}/
